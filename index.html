<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Relaciones de ítems de Foxhole</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="themed-dropdown.css">
</head>
<body>
  <div id="app">
    <header>
      <h1>Relaciones de ítems de Foxhole</h1>
      <nav class="site-nav" aria-label="Navegación principal">
        <a href="calculator.html">Calculadora de proyectos</a>
      </nav>
      <div class="controls">
        <input type="text" id="search" class="form-control" placeholder="Buscar ítem..." autocomplete="off">
        <select id="category-filter" class="form-control select-control" aria-label="Filtrar por categoría">
          <option value="">Todas las categorías</option>
        </select>
        <select id="faction-filter" class="form-control select-control" aria-label="Filtrar por facción">
          <option value="">Todas las facciones</option>
          <option value="Colonials">Colonials</option>
          <option value="Wardens">Wardens</option>
        </select>
        <button id="clear-selection">Limpiar</button>
      </div>
    </header>
    <main>
      <aside id="sidebar">
        <div id="item-info">
          <p>Haz clic en una fila o celda para ver los detalles.</p>
        </div>
      </aside>
      <div id="matrix-container">
        <div id="matrix"></div>
      </div>
    </main>
  </div>
  <script src="themed-dropdown.js"></script>
  <script src="app.js"></script>
</body>
</html>
