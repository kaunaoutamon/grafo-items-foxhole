<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Relaciones de ítems de Foxhole</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header>
      <h1>Relaciones de ítems de Foxhole</h1>
      <div class="controls">
        <input type="text" id="search" placeholder="Buscar ítem..." autocomplete="off">
        <select id="category-filter">
          <option value="">Todas las categorías</option>
        </select>
        <button id="clear-selection">Limpiar</button>
      </div>
    </header>
    <main>
      <aside id="sidebar">
        <div id="item-info">
          <p>Haz clic en una fila o celda para ver los detalles.</p>
        </div>
      </aside>
      <div id="matrix-container">
        <div id="matrix"></div>
      </div>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
