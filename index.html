<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Foxhole Item Relations</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header>
      <h1>Foxhole Item Relations</h1>
      <div class="controls">
        <input type="text" id="search" placeholder="Search item..." autocomplete="off">
        <select id="category-filter">
          <option value="">All categories</option>
        </select>
        <button id="clear-selection">Clear</button>
      </div>
    </header>
    <main>
      <aside id="sidebar">
        <div id="item-info">
          <p>Click a row or cell to see details.</p>
        </div>
      </aside>
      <div id="matrix-container">
        <div id="matrix"></div>
      </div>
    </main>
  </div>
  <script src="/public/app.js"></script>
</body>
</html>
